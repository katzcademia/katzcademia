<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es" xml:lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Katzcademia | Pedidos y consultas</title>
</head>
<body>
    <h1>Formulario de pedidos y consultas</h1>
    <p>Completa este formulario para consultar sobre nuestros útiles escolares. Utiliza datos ficticios durante las pruebas.</p>

    <form action="https://api.web3forms.com/submit" method="post">
        <div>
            <input type="hidden" name="access_key" value="TU_ACCESS_KEY" />
            <input type="hidden" name="subject" value="Nueva consulta de Katzcademia" />
            <input type="hidden" name="from_name" value="Sitio web Katzcademia" />
        </div>

        <fieldset>
            <legend>Datos de contacto</legend>

            <p>
                <label for="nombre">Nombre:</label><br />
                <input type="text" name="name" id="nombre" size="40" />
            </p>

            <p>
                <label for="correo">Correo electrónico:</label><br />
                <input type="text" name="email" id="correo" size="40" />
            </p>
        </fieldset>

        <fieldset>
            <legend>Información de la consulta</legend>

            <p>
                <label for="producto">Producto de interés:</label><br />
                <select name="producto" id="producto">
                    <option value="Cuadernos">Cuadernos</option>
                    <option value="Lapices y boligrafos">Lápices y bolígrafos</option>
                    <option value="Mochilas">Mochilas</option>
                    <option value="Otro">Otro</option>
                </select>
            </p>

            <p>Tipo de solicitud:</p>
            <p>
                <input type="radio" name="tipo_solicitud" id="consulta" value="Consulta" />
                <label for="consulta">Consulta</label>
                <input type="radio" name="tipo_solicitud" id="pedido" value="Pedido" />
                <label for="pedido">Solicitud de pedido</label>
            </p>

            <p>
                <input type="checkbox" name="acepta_contacto" id="acepta_contacto" value="Si" />
                <label for="acepta_contacto">Acepto que Katzcademia utilice estos datos ficticios para responder la prueba.</label>
            </p>

            <p>
                <label for="mensaje">Mensaje:</label><br />
                <textarea name="message" id="mensaje" rows="6" cols="45"></textarea>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar consulta" />
            <input type="reset" value="Borrar formulario" />
        </p>
    </form>

    <h2>Menú de navegación</h2>
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="paginas/catalogo.html">Catálogo</a></li>
        <li><a href="paginas/contacto.html">Contacto</a></li>
    </ul>
</body>
</html>
